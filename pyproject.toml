[project]
name = "kaggle-video-studio"
version = "0.1.0"
description = "Free open-source AI reels for ecommerce—Kaggle GPU studio, Hindi TTS, festival campaigns. MIT."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "kaggle>=2.2.4",
]

[tool.fastapi]
entrypoint = "app.main:app"

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    # Pillow renders the runner's brand assets, so the tests need it locally
    # even though the GPU dependencies stay Kaggle-only.
    "pillow>=10.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "pillow>=10.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
kaggle-video-studio = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*", "resources/**/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
exclude = ["^kaggle_runner/run\\.py$"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
