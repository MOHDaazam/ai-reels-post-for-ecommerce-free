<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <div class="grain"></div>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="mark">KV</span>
      <span>
        <strong>{{ app_name }}</strong>
        <small>{{ brand_line }}</small>
      </span>
    </a>
    <nav>
      <a href="/" class="{% if page == 'studio' %}active{% endif %}">Studio</a>
      <a href="/logs" class="{% if page == 'logs' %}active{% endif %}">Logs</a>
      <a href="/setup" class="{% if page == 'setup' %}active{% endif %}">Setup</a>
    </nav>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <span>Localhost single-user studio</span>
    <span>{{ brand_line }}</span>
  </footer>
  <script src="/static/js/app.js"></script>
</body>
</html>
